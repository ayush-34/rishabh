<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dwg Ballooning - v2.0.0</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Dwg Ballooning - Enhanced Version</h1>
        <small>Created By RT</small>
    </header>
    <main>
        <div id="canvas-container">
            <!-- Canvas for drawing -->
            <canvas id="drawingCanvas"></canvas>
        </div>
        <div id="controls">
            <button id="save">Save JSON</button>
            <button id="load">Load JSON</button>
            <button id="undo">Undo (Ctrl+Z)</button>
            <button id="redo">Redo (Ctrl+Y)</button>
            <button id="batchSelect">Batch Select</button>
            <button id="snapToGrid">Snap to Grid</button>
            <button id="copy">Copy (Ctrl+C)</button>
            <button id="paste">Paste (Ctrl+V)</button>
            <button id="rotate">Rotate</button>
        </div>
        <div id="statistics">
            <p id="statsPanel"></p>
        </div>
    </main>
    <footer>
        <p>Enhancements: Version v2.0.0 includes enhanced saving/loading, undo/redo, batch selection, keyboard shortcuts, grid display, and rotation support.</p>
    </footer>
</body>
</html>
